<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image & Text Recognition</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container mt-5">

   <h1 class="text-center text-primary mb-4">
    AI Image & Text Recognition System
</h1>

    <form action="/" method="POST" enctype="multipart/form-data">

        <input type="file" name="image" accept="image/*">

        <br><br>

      <button type="submit" class="btn btn-primary">
    Upload Image
</button>

    </form>

    {% if image_name %}

    <h2>Uploaded Image</h2>

    <img src="{{ url_for('uploaded_file', filename=image_name) }}"
         width="400">

    {% endif %}

    {% if text %}

    <h2>Extracted Text</h2>

    <textarea rows="10" cols="70">{{ text }}</textarea>

    <br><br>
<button type="button" class="btn btn-success" onclick="copyText()">
    Copy Text
</button>

    <a href="/download?text={{ text }}">
      <button type="button" class="btn btn-warning">
    Download Text
</button>
    </a>

    <br><br>

    <h3>OCR Confidence : {{ confidence }}%</h3>

    {% endif %}

</div>

<script>
function copyText() {
    const textarea = document.querySelector("textarea");
    textarea.select();
    navigator.clipboard.writeText(textarea.value);
    alert("Text copied successfully!");
}
</script>

</body>
</html>
